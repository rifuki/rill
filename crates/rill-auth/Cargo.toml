[package]
name = "rill-auth"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
rill-core = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

sui-sdk-types = { workspace = true, features = ["serde", "hash"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "sha256"] }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "sha256"] }

[dev-dependencies]
sui-crypto = { workspace = true }
