[package]
name = "rill-chain"
edition.workspace = true
version.workspace = true
license.workspace = true
[dependencies]
rill-core = { workspace = true }
sui-rpc = { workspace = true }
sui-sdk-types = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
prost-types = "0.14"
tonic = "0.14"
[dev-dependencies]
# Only a live test signs anything here. Keeping it out of [dependencies] is what keeps a signing
# library out of rill-server's production graph, which is the whole of the keyless claim.
sui-crypto = { workspace = true }
rill-ptb = { workspace = true }
bcs = "0.1"
tokio = { workspace = true, features = ["macros", "rt"] }
sui-transaction-builder = { workspace = true }
