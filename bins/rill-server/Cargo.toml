[package]
name = "rill-server"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "rill_server"
path = "src/lib.rs"

[[bin]]
name = "rill-server"
path = "src/main.rs"

[dependencies]
rill-core = { workspace = true }
rill-chain = { workspace = true }
rill-ptb = { workspace = true }
rill-mcp = { workspace = true }
rill-auth = { workspace = true }
rill-store = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rill-policy = { workspace = true }
tower-http = { version = "0.6", features = ["cors"] }

sui-sdk-types = { workspace = true }

sui-transaction-builder = { workspace = true }

base64 = { workspace = true }

bcs = "0.1"

[dev-dependencies]
rill-auth = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

