[package]
name = "rill"
edition.workspace = true
version.workspace = true
license.workspace = true
# Two binaries build from one `main.rs`, so a bare `cargo run -p rill` needs telling which.
default-run = "rill"

[lib]
name = "rill_cli"
path = "src/lib.rs"

[[bin]]
name = "rill"
path = "src/main.rs"

# The same program under the name the release ships. The workflow builds `--bin rill-wallet`, the
# smoke step runs it, and the README curls `rill-wallet-<platform>`; `rill` stays for this
# repository's own use (`cargo run -p rill`, the docs, the run-set tooling). Both must resolve or
# one of those paths breaks.
[[bin]]
name = "rill-wallet"
path = "src/main.rs"

[dependencies]
bcs = { workspace = true }
sui-transaction-builder = { workspace = true }
base64 = { workspace = true }
rill-core = { workspace = true }
rill-chain = { workspace = true }
rill-ptb = { workspace = true }
rill-policy = { workspace = true }
rill-mcp = { workspace = true }
sui-crypto = { workspace = true }
rmcp = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sui-sdk-types = { workspace = true }

[dev-dependencies]
sui-transaction-builder = { workspace = true }
rand = { workspace = true }

