[package]
name = "rill"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "rill_cli"
path = "src/lib.rs"

# One binary, under the name it ships as. The workflow builds `--bin rill-wallet`, the smoke step
# runs it, the README curls `rill-wallet-<platform>`, `status()` prints it and `serverInfo.name`
# answers with it: a second cargo target called `rill` would be a fifth spelling of the same
# program, which is the drift this unit exists to remove. `cargo run -p rill` still resolves,
# because a package with one bin needs no `default-run`.
#
# The two names briefly both existed, sharing `path = "src/main.rs"`, and cargo answered every
# build, test and clippy run with "found to be present in multiple build targets" while compiling
# the file twice. A warning on every command is not a naming scheme.
[[bin]]
name = "rill-wallet"
path = "src/main.rs"

[dependencies]
bcs = { workspace = true }
sui-transaction-builder = { workspace = true }
base64 = { workspace = true }
rill-core = { workspace = true }
rill-chain = { workspace = true }
rill-ptb = { workspace = true }
rill-policy = { workspace = true }
rill-mcp = { workspace = true }
sui-crypto = { workspace = true }
rmcp = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sui-sdk-types = { workspace = true }

[dev-dependencies]
sui-transaction-builder = { workspace = true }
rand = { workspace = true }

