name: CI

on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2

      # The pin has to bind, not merely exist. `rust-toolchain.toml` is an override rustup applies
      # inside this directory, and three things that outrank it are one line away: a `+toolchain`
      # argument, a `RUSTUP_TOOLCHAIN` in the environment, and a setup step that installs something
      # else and makes it the default. Under any of them fmt, clippy and the whole suite report on a
      # compiler nobody chose, and that kind of green is worth less than red. So the version is read
      # back out of the tools that are about to run.
      - name: The pinned toolchain is the one that runs
        run: |
          pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          echo "$pinned" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::rust-toolchain.toml pins '$pinned'; it must name an exact version, three numbers, not a channel"
            exit 1; }
          for tool in rustc cargo; do
            got=$("$tool" --version | cut -d' ' -f2)
            [ "$got" = "$pinned" ] || {
              echo "::error::$tool reports $got but rust-toolchain.toml pins $pinned, so something outranks the toolchain file"
              exit 1; }
          done
          echo "rustc and cargo are both $pinned, as pinned."

      # `--locked` on everything that resolves: a run that rewrote Cargo.lock to get green tested
      # dependency versions no reviewer saw, and the image and the release binaries would then be
      # built from a different tree than the one CI approved.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The architecture's load-bearing invariant (KTD-1). rill-core holds two thirds of the
  # system's logic and must stay unable to perform I/O, not by convention but because it
  # cannot name anything that does. A dependency added three crates away that drags tokio
  # into rill-core would be invisible in review; it is not invisible here.
  purity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: rill-core must have no I/O in its dependency graph
        run: |
          if cargo tree -p rill-core --locked --edges normal \
             | grep -E '\b(tokio|axum|sui-rpc|reqwest|hyper|tonic)\b'; then
            echo "::error::rill-core gained an I/O dependency. See KTD-1 in docs/plans/."
            exit 1
          fi
          echo "rill-core is pure."

      # The money-path invariant. The reference implementation stated this in a comment and
      # still let a float reach a DeepBook order price, and a comment cannot stop `Number(v)`.
      # Here no float type may appear in the crate at all, so there is nothing to slip through.
      # The keyless claim, as a fact about the build rather than a promise in prose. rill-server
      # builds and simulates and never signs, and the strongest form of that is a binary with no
      # signing library linked into it at all. This was nearly untrue by accident: rill-chain and
      # rill-auth both declared sui-crypto and neither used it outside a live test, so the library
      # sat in the server's graph and the claim rested on no code path reaching for it.
      - name: rill-server must have no signing library in its graph
        run: |
          if cargo tree --locked -p rill-server --edges normal | grep -E '\bsui-crypto\b'; then
            echo "::error::rill-server gained a signing library. It builds and simulates; the \
          signer holds the key. See R11 and KTD-3."
            exit 1
          fi
          echo "rill-server cannot sign: no signing library is linked."

      # And the other half, because an asymmetry nobody checks in both directions is one claim, not
      # two: the signer must still be able to sign.
      - name: the signer must have one
        run: |
          cargo tree --locked -p rill --edges normal | grep -qE '\bsui-crypto\b' || {
            echo "::error::the signer lost its signing library, so nothing can complete a spend"
            exit 1; }
          echo "the signer can sign."

      - name: rill-core must contain no floating-point type
        run: |
          # Strip doc comments first: this file's own prose explains why floats are banned,
          # and matching that text would fail the build for saying so.
          if grep -rn --include='*.rs' -vE '^\s*(//|\*)' crates/rill-core/src \
             | grep -E '\bf(32|64)\b'; then
            echo "::error::A floating-point type appeared in rill-core. See KTD-4 in docs/plans/."
            exit 1
          fi
          echo "rill-core has no floating-point arithmetic."

  # A house style that was written down and then not followed. The em dash is banned in everything
  # this repository emits, and the rule held right up until an agent added three in one commit,
  # which is the moment a convention becomes a check. 884 of them predated the rule and are cleaned
  # as files are touched, so this is a ratchet rather than a sweep: nothing new lands, and the
  # backlog does not fail an unrelated build. It is working as intended rather than in principle:
  # the backlog was 884 when this check landed and is lower now, and nothing has been added since.
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: No em dash on any line this change adds
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # A first push to a branch reports an all-zero "before"; there is nothing to diff
          # against, so compare with the merge base against the default branch instead.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD~1)
          fi
          added=$(git diff "$base"...HEAD --unified=0 | grep '^+' | grep -v '^+++' || true)
          if printf '%s' "$added" | grep -q $'\u2014'; then
            printf '%s\n' "$added" | grep -n $'\u2014' || true
            echo "::error::An em dash (U+2014) was added. Use a comma, a colon, parentheses, or two sentences."
            exit 1
          fi
          echo "No em dash added."

  # The contracts, tested by the same toolchain version every time. A Move test suite that
  # silently follows whatever `sui` the runner happens to ship is one that starts failing for
  # reasons unrelated to the change under review.
  move:
    runs-on: ubuntu-latest
    env:
      SUI_CLI_VERSION: testnet-v1.78.0
    steps:
      - uses: actions/checkout@v4
      - name: Install the Sui CLI
        run: |
          set -euo pipefail
          curl -fsSL -o sui.tgz \
            "https://github.com/MystenLabs/sui/releases/download/${SUI_CLI_VERSION}/sui-${SUI_CLI_VERSION}-ubuntu-x86_64.tgz"
          mkdir -p "$HOME/.sui/bin" && tar -xzf sui.tgz -C "$HOME/.sui/bin"
          echo "$HOME/.sui/bin" >> "$GITHUB_PATH"
      - run: sui --version
      - name: agent_wallet
        working-directory: move/agent_wallet
        run: sui move test
      - name: rill_guard
        working-directory: move/rill_guard
        run: sui move test

  # The Rust builder emits Move calls positionally, so a signature change in the contracts that the
  # builder does not follow is a wrong-arity call the node rejects. These read the Move source and
  # check the emitted shape against it, which is the drift that killed the reference implementation.
  signatures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - run: cargo test -p rill-ptb --test move_signatures --locked

  # The supply chain, which `--locked` alone does not cover. `--locked` pins which versions resolve;
  # it says nothing about what those versions do at build time. A `build.rs` added inside a tree that
  # was already approved runs arbitrary code with the privileges of the build, before any test of
  # ours executes, and a campaign is currently using exactly that to read Sui keystores off
  # developer and CI machines. A keystore is the one secret in this project that cannot be rotated
  # back into safety after it leaves, so the control is review, and review needs a diff.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      # Stated on its own, ahead of any build: the lockfile is already what the manifests resolve to.
      # Every other cargo line in this repository carries `--locked`, but they all do other work
      # first, so a lockfile that needed rewriting would be reported as whatever else failed.
      - name: Cargo.lock is already what the manifests resolve to
        run: cargo metadata --format-version 1 --locked > /dev/null
      - name: No dependency gained a build script without review
        run: scripts/audit-build-scripts.sh check

  # Proves the runtime image builds and answers its own healthcheck before anything is pushed.
  # A container that compiles but cannot start is the failure this catches.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rill-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A container binds every interface or nothing outside it can connect, and the server refuses a
      # wide bind unless that is stated. `compose.yaml` states it for a real deployment; this states
      # it for the same reason, and the flag being needed here is the check working rather than an
      # inconvenience. The port is published only to this runner.
      - name: The container must start and answer /health
        run: |
          docker run -d --name rill -p 3939:3939 \
            -e RILL_ALLOW_OPEN_AUTHORIZATION=1 \
            rill-server:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3939/health > /dev/null; then
              echo "healthy after ${i}s"; docker logs rill; exit 0
            fi
            sleep 1
          done
          echo "::error::the container never became healthy"; docker logs rill; exit 1
      # The acknowledgement above is load-bearing, so check it is. Without it the container must
      # refuse rather than start, or the boot check has stopped doing anything and this job would be
      # the last place to notice.
      - name: Without the acknowledgement the container refuses to start
        run: |
          set +e
          output=$(docker run --rm --name rill-unack rill-server:ci 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::a wide bind with no acknowledgement started anyway"
            printf '%s\n' "$output"
            exit 1
          fi
          printf '%s\n' "$output" | grep -q "no consent step" || {
            echo "::error::it refused, but not for the reason this check exists for"
            printf '%s\n' "$output"
            exit 1
          }
          echo "refused, naming the reason."
