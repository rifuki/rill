name: Release

# Third-party actions are pinned to commits, not to refs.
#
# `dtolnay/rust-toolchain@1.96.0` looks exact and is not: `git ls-remote` shows 1.96, 1.96.0 and
# 1.96.1 are all live maintained branches, so the ref pins which Rust the action installs and says
# nothing about the action's own code. Every action here runs with write access to the job that
# produces the binary a stranger downloads, which is the one place a mutable ref is least
# acceptable. The version each commit corresponds to is in the trailing comment, because a bare
# forty-character hash tells a reviewer nothing about what it is supposed to be.
#
# Updating one: resolve the tag with `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`, read
# what changed, then change both the hash and the comment in the same commit.

# The asset names are a contract, not a convention. README.md's Install section hands users a curl
# command pointing at these exact filenames, and bins/rill/tests/release_contract.rs asserts that
# the names here, the names in the README, and the name the binary prints are one and the same.
# A rename in any one of those places fails the build rather than a stranger's install.
#
# One origin publishes the release: github.com/rifuki/rill, the repository this workflow lives in.
# A tag pushed here produces assets here and nowhere else (plan KTD-5, U5). The binary is published
# from the repository whose source builds it, which is the only arrangement under which a tag names
# the commit that produced the asset.
#
# The series it continues was started elsewhere. github.com/naisu-one/rill (the TypeScript
# specification, formerly eseslabs/rill) published `rill-wallet-v0.2.0` on 2026-07-19 carrying these
# same three asset names, and the instruction generators in that repository still hand agents its
# download URL. So the next release here is `rill-wallet-v0.3.0`, not a restart, and the tag filter
# accepts that spelling: a filter of `v*` alone would never have matched the convention already in
# use, and every tag pushed under it would have produced nothing at all. Moving the published
# instructions to this origin is owed by U13 and is tracked in the plan's Open Questions.
#
# Two ways to run it:
#   - a `rill-wallet-v*` or `v*` tag: builds all three, checks each one starts, and attaches
#     everything to the release.
#   - workflow_dispatch: builds and checks, then stops. `publish` is gated on the ref being a tag,
#     so a manual run is a dry run and cannot attach assets to anything.
on:
  push:
    tags: ["rill-wallet-v*", "v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Nothing is built until the tree's build scripts are the reviewed ones. A tag can be pushed from
  # any commit, including one CI never saw, and every `build.rs` in the dependency graph runs on
  # these runners with the privileges of the build. The asset a stranger downloads and checks a
  # checksum for is only as trustworthy as what ran while it was produced, so this gate comes first
  # and the three build jobs wait on it (plan U6, R6).
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d # 1.96.0
      - name: Cargo.lock is already what the manifests resolve to
        run: cargo metadata --format-version 1 --locked > /dev/null
      - name: No dependency gained a build script without review
        run: scripts/audit-build-scripts.sh check

  wallet:
    needs: supply-chain
    name: rill-wallet (${{ matrix.asset }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners rather than cross-compilation: the signer links a TLS stack and a
          # crypto library, and a binary that builds under cross but fails at runtime on a user's
          # machine is the worst of both.
          #
          # macos-13 was the Intel runner until GitHub retired it, and a job that names a retired
          # label never schedules; macos-15-intel is the label that replaced it. Two of three
          # assets is not a release.
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: rill-wallet-darwin-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: rill-wallet-darwin-x64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: rill-wallet-linux-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d # 1.96.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # `--locked`: a release built from a lockfile cargo had to rewrite is a release built from
      # dependencies nobody reviewed.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin rill-wallet

      # The binary must actually run on the machine it was built for. An artifact that cannot
      # start is indistinguishable from a working one until a user downloads it.
      #
      # A runner has no key, so `--status` exits 1 and says "not ready": that is the expected
      # answer, not a failure. Anything above 1 is one: 126 for a file the OS cannot execute, 127
      # for a loader that cannot find a library, 134 for an abort, 139 for a segfault. The earlier
      # form of this step swallowed every exit code with `|| true` and grepped a second run, which
      # passed a binary that identified itself and then crashed.
      # `shell: bash` on purpose. Without it the runner uses `bash -e {0}`, and the harness in
      # release_contract.rs runs this script under `bash --noprofile --norc -eo pipefail -c`, the
      # invocation this key selects. The two agreed on every case tried, but a test that runs the
      # step under different semantics than CI is a test of something else, and pipefail is exactly
      # the semantics this script's `$(...)` capture depends on.
      - name: The binary must start and report itself
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/rill-wallet
          code=0
          out=$("$BIN" --status) || code=$?
          printf '%s\n' "$out"
          [ "$code" -le 1 ] || {
            echo "::error::rill-wallet --status exited $code, so the binary cannot start"; exit 1; }
          head -n 1 <<<"$out" | grep -qx "rill-wallet" || {
            echo "::error::the binary did not identify itself as rill-wallet"; exit 1; }

      - name: Name it exactly what users already curl
        run: |
          cp target/${{ matrix.target }}/release/rill-wallet "${{ matrix.asset }}"
          shasum -a 256 "${{ matrix.asset }}" | tee "${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  publish:
    needs: wallet
    runs-on: ubuntu-latest
    # A tag, and only a tag. This is what makes a workflow_dispatch run a dry run. Both spellings
    # the trigger accepts are listed, because a gate narrower than the trigger builds the assets
    # and then silently attaches them to nothing.
    if: startsWith(github.ref, 'refs/tags/rill-wallet-v') || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
      # Checksums ship alongside the binaries. A user handed a curl command has no other way to
      # tell whether what arrived is what was built.
      - name: Attach every asset to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            rill-wallet-darwin-arm64
            rill-wallet-darwin-arm64.sha256
            rill-wallet-darwin-x64
            rill-wallet-darwin-x64.sha256
            rill-wallet-linux-x64
            rill-wallet-linux-x64.sha256
          fail_on_unmatched_files: true
