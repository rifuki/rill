name: Release

# The asset names are a contract, not a convention. README.md's Install section hands users a curl
# command pointing at these exact filenames, and bins/rill/tests/release_contract.rs asserts that
# the names here, the names in the README, and the name the binary prints are one and the same.
# A rename in any one of those places fails the build rather than a stranger's install.
#
# One origin publishes the release: github.com/rifuki/rill, the repository this workflow lives in.
# A tag pushed here produces assets here and nowhere else (plan KTD-5, U5).
#
# Two ways to run it:
#   - a `v*` tag: builds all three, checks each one starts, and attaches everything to the release.
#   - workflow_dispatch: builds and checks, then stops. `publish` is gated on the ref being a tag,
#     so a manual run is a dry run and cannot attach assets to anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wallet:
    name: rill-wallet (${{ matrix.asset }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners rather than cross-compilation: the signer links a TLS stack and a
          # crypto library, and a binary that builds under cross but fails at runtime on a user's
          # machine is the worst of both.
          #
          # macos-13 was the Intel runner until GitHub retired it, and a job that names a retired
          # label never schedules; macos-15-intel is the label that replaced it. Two of three
          # assets is not a release.
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: rill-wallet-darwin-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: rill-wallet-darwin-x64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: rill-wallet-linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # `--locked`: a release built from a lockfile cargo had to rewrite is a release built from
      # dependencies nobody reviewed.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin rill-wallet

      # The binary must actually run on the machine it was built for. An artifact that cannot
      # start is indistinguishable from a working one until a user downloads it.
      #
      # A runner has no key, so `--status` exits 1 and says "not ready": that is the expected
      # answer, not a failure. Anything above 1 is one: 126 for a file the OS cannot execute, 127
      # for a loader that cannot find a library, 134 for an abort, 139 for a segfault. The earlier
      # form of this step swallowed every exit code with `|| true` and grepped a second run, which
      # passed a binary that identified itself and then crashed.
      - name: The binary must start and report itself
        run: |
          BIN=target/${{ matrix.target }}/release/rill-wallet
          code=0
          out=$("$BIN" --status) || code=$?
          printf '%s\n' "$out"
          [ "$code" -le 1 ] || {
            echo "::error::rill-wallet --status exited $code, so the binary cannot start"; exit 1; }
          head -n 1 <<<"$out" | grep -qx "rill-wallet" || {
            echo "::error::the binary did not identify itself as rill-wallet"; exit 1; }

      - name: Name it exactly what users already curl
        run: |
          cp target/${{ matrix.target }}/release/rill-wallet "${{ matrix.asset }}"
          shasum -a 256 "${{ matrix.asset }}" | tee "${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  publish:
    needs: wallet
    runs-on: ubuntu-latest
    # A tag, and only a tag. This is what makes a workflow_dispatch run a dry run.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # Checksums ship alongside the binaries. A user handed a curl command has no other way to
      # tell whether what arrived is what was built.
      - name: Attach every asset to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rill-wallet-darwin-arm64
            rill-wallet-darwin-arm64.sha256
            rill-wallet-darwin-x64
            rill-wallet-darwin-x64.sha256
            rill-wallet-linux-x64
            rill-wallet-linux-x64.sha256
          fail_on_unmatched_files: true
